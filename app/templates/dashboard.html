{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Sua Coleção de Livros</h2>
    <div class="row">
        <div class="col-md-12 mb-4">
            <a href="{{ url_for('book.add') }}" class="btn btn-primary">Adicionar Novo Livro</a>
        </div>
    </div>

    <div class="row">
        {% for book in current_user.books %}
        <div class="col-md-4 mb-4">
            <div class="card">
                <img src="{{ book.cover_url }}" class="card-img-top" alt="Capa do Livro">
                <div class="card-body">
                    <h5 class="card-title">{{ book.title }}</h5>
                    <p class="card-text">{{ book.author }}</p>
                    <p class="card-text"><strong>Status:</strong> {{ book.status }}</p>
                    <a href="{{ url_for('book.details', book_id=book.id) }}" class="btn btn-info">Ver Detalhes</a>
                    <a href="{{ url_for('book.edit', book_id=book.id) }}" class="btn btn-warning">Editar</a>
                    <a href="{{ url_for('book.delete', book_id=book.id) }}" class="btn btn-danger">Deletar</a>
                </div>
            </div>
        </div>
        {% else %}
        <p>Você ainda não adicionou nenhum livro.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
