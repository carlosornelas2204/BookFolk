{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-info text-white">
            <h4>Recomendação do Dia</h4>
        </div>
        <div class="card-body text-center">
            {% if book %}
            <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg" 
                 class="img-thumbnail mb-3" 
                 style="max-height: 200px;">
            <h3>{{ book.title }}</h3>
            <p class="text-muted">{{ book.author }}</p>
            <p><span class="badge bg-secondary">{{ book.genre }}</span></p>
            
            <div class="mt-4">
                <a href="{{ url_for('main.rate_book', book_id=book.id) }}" 
                   class="btn btn-primary">
                    Começar a Ler
                </a>
                <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary">
                    Outra Recomendação
                </a>
            </div>
            {% else %}
            <div class="alert alert-warning">
                Não encontramos livros para recomendar. Você já leu todos!
            </div>
            <a href="{{ url_for('main.books') }}" class="btn btn-primary">
                Buscar Livros
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
